<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Track your order | SMMCaptain.xyz</title>
  <link rel="stylesheet" href="/style.css?v=20261026-6">
  <link rel="stylesheet" href="/track/track.css?v=20261027-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/site-notice.js?v=20261026-3" defer></script>
  <script src="/site-support.js?v=20261028-1" defer></script>
  <script src="/brand-logo.js?v=20261025-1" defer></script>
  <script src="/track/track.js?v=20261028-1" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand track-brand" href="/">
        <div class="logo" data-brand-logo><span class="logo-fallback">S</span></div>
        <div>SMMCaptain<span>.xyz</span></div>
      </a>
      <a class="track-home" href="/">মূল পেজে ফিরুন</a>
    </div>
  </header>
  <aside class="site-notice" data-site-notice aria-label="Website announcement" hidden><div class="site-notice-inner"><div class="site-notice-track" data-site-notice-text></div></div></aside>
  <main class="track-main">
    <section class="track-card" aria-labelledby="trackTitle">
      <div class="track-icon" aria-hidden="true">↗</div>
      <p class="track-eyebrow">ORDER SUPPORT</p>
      <h1 id="trackTitle">Track your order</h1>
      <p class="track-intro">অর্ডার আইডি অথবা অর্ডারের সময় দেওয়া যোগাযোগ নম্বর দিয়ে আপনার অর্ডারের অবস্থা দেখুন।</p>
      <form id="trackForm" class="track-form">
        <label for="orderId">অর্ডার আইডি বা যোগাযোগ নম্বর</label>
        <div class="track-input-row">
          <input id="orderId" name="orderId" type="text" placeholder="SC-20261024-1041 অথবা 017XXXXXXXX"
            autocomplete="off" maxlength="32" required>
          <button class="primary" type="submit" id="trackButton">অর্ডার স্টেটাস দেখুন</button>
        </div>
        <p class="track-hint">নম্বর দিয়ে খুঁজলে নতুন অর্ডার আগে দেখানো হবে।</p>
      </form>
      <div id="trackResult" class="track-result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
</body>
</html>
