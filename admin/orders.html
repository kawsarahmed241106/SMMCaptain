<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Campaign orders | SMMCaptain Admin</title>
  <link rel="stylesheet" href="style.css?v=20261025-1">
  <link rel="stylesheet" href="orders.css?v=20261026-6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="../brand-logo.js?v=20261025-1" defer></script>
  <script src="orders.js?v=20261026-7" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark" data-brand-logo>S</span><span>SMMCaptain <small>ADMIN</small></span></a>
      <a class="site-link" href="index.html">Site settings ↗</a>
      <a class="site-link" href="../index.html" target="_blank" rel="noopener">View website ↗</a>
    </header>
    <section class="orders-page">
      <div class="page-heading">
        <div><p class="eyebrow">ORDER MANAGEMENT</p><h1>Campaign orders</h1><p class="muted">Review customer details and submitted campaign settings.</p></div>
        <button class="button ghost" type="button" id="refreshOrders">Refresh</button>
      </div>
      <div class="notice" id="ordersStatus" role="status">Checking admin access…</div>
      <div class="orders-list" id="ordersList"></div>
      <p class="orders-footer" id="ordersFooter"></p>
    </section>
  </main>
  <dialog class="delete-order-dialog" id="deleteOrderDialog" aria-labelledby="deleteOrderTitle">
    <form id="deleteOrderForm">
      <p class="eyebrow">PERMANENT ACTION</p>
      <h2 id="deleteOrderTitle">Delete this order?</h2>
      <p class="delete-order-copy">This permanently deletes order <strong id="deleteOrderLabel"></strong> and its saved details. Enter your admin password to continue.</p>
      <label for="deleteOrderPassword">Admin password</label>
      <input id="deleteOrderPassword" name="password" type="password" autocomplete="current-password" required>
      <p class="delete-order-error" id="deleteOrderError" role="alert" hidden></p>
      <div class="delete-order-actions">
        <button class="button ghost" type="button" id="cancelDeleteOrder">Cancel</button>
        <button class="delete-order-confirm" type="submit">Confirm delete</button>
      </div>
    </form>
  </dialog>
</body>
</html>
