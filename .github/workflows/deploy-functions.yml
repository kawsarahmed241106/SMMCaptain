name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-uddoktapay-checkout --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase functions deploy verify-uddoktapay-payment --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
